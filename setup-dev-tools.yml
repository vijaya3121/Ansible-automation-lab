---
- name: Install Git, Curl, and Nginx, then deploy website
  hosts: localhost
  become: yes

  tasks:
    - name: Install Git
      apt:
        name: git
        state: present
        update_cache: yes

    - name: Install Curl
      apt:
        name: curl
        state: present

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Clone sample website repository
      git:
        repo: "https://github.com/vijaya3121/sample-website.git"
        dest: /tmp/sample-website
        version: main
        force: yes

    - name: Copy website files to Nginx web root
      copy:
        src: /tmp/sample-website/
        dest: /var/www/html/
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
